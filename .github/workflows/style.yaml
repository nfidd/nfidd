name: Style

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

jobs:
  check-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pure-text conventions from CONTRIBUTING.md (headings, prose, shared
      # slide config). No dependencies, no rendering. The slide-overflow rule
      # needs a rendered site and a browser, so it runs in the deploy workflow.
      - name: Check style
        run: node scripts/check-style.mjs
